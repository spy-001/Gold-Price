<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="keywords" content="ราคาทอง, ราคาทองวันนี้, ราคาทองคำแท่ง, เช็กราคาทอง, ทองคำแท่ง 96.5">

  <meta property="og:type" content="website">
  <meta property="og:title" content="ราคาทองคำแท่งไทย ล่าสุด | เช็กราคาทองวันนี้">
  <meta property="og:description" content="เช็กราคาทองคำแท่ง 96.5% ล่าสุด อัปเดตรวดเร็ว ราคาซื้อ-ขายออก ประจำวันนี้">

  <meta name="twitter:description" content="เช็กราคาทองคำแท่ง 96.5% ล่าสุด อัปเดตรวดเร็ว ราคาซื้อ-ขายออก ประจำวันนี้">
  <meta name="twitter:image" content="https://www.matichon.co.th/wp-content/uploads/2017/08/%E0%B8%97%E0%B8%AD%E0%B8%87.jpg">

  <style>
    :root {
      --bg: #f3f4f6;
      --white: #ffffff;
      --gold: #b88716;
      --gold-dark: #735100;
      --gold-light: #fff8df;
      --text: #202124;
      --muted: #666;
      --border: #d6b75d;
      --green: #16843b;
      --green-bg: #e3f6e9;
      --red: #c62828;
      --red-bg: #ffebeb;
      --gray: #777;
      --gray-bg: #ddd;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(90deg, rgba(184, 135, 22, .05) 2px, transparent 2px),
        var(--bg);
      background-size: 28px 100%;
      color: var(--text);
      font-family: Arial, Tahoma, sans-serif;
      font-size: 19px;
      line-height: 1.4;
    }

    .page {
      width: min(820px, 100%);
      margin: auto;
      padding: 12px 16px 18px;
    }

    .top-line {
      height: 6px;
      margin-bottom: 12px;
      border-radius: 20px;
      background: linear-gradient(
        90deg,
        #987016,
        #f8e6a2,
        #c99725,
        #987016
      );
    }

    header {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 13px;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: 14px;
      background: var(--white);
      box-shadow: 0 3px 10px rgba(0, 0, 0, .1);
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 52px;
      width: 52px;
      height: 52px;
      border: 2px solid var(--gold);
      border-radius: 50%;
      background: var(--gold-light);
      color: var(--gold-dark);
      font-size: 29px;
      font-weight: bold;
    }

    h1 {
      margin: 0;
      color: var(--gold-dark);
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.15;
    }

    .subtitle {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: clamp(17px, 3vw, 22px);
    }

    .price-card {
      position: relative;
      overflow: hidden;
      padding: 18px 22px;
      border: 2px solid var(--border);
      border-radius: 17px;
      background: var(--white);
      box-shadow: 0 4px 14px rgba(0, 0, 0, .11);
    }

    .price-card::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 27%;
      height: 100%;
      opacity: .1;
      pointer-events: none;
      background: repeating-linear-gradient(
        90deg,
        var(--gold),
        var(--gold) 2px,
        transparent 2px,
        transparent 13px
      );
      mask-image: linear-gradient(to left, black, transparent);
    }

    .card-title {
      position: relative;
      z-index: 1;
      margin: 0;
      color: var(--gold-dark);
      font-size: clamp(26px, 5vw, 36px);
      line-height: 1.2;
    }

    .card-subtitle {
      position: relative;
      z-index: 1;
      margin: 3px 0 14px;
      color: var(--muted);
      font-size: clamp(16px, 3vw, 21px);
    }

    .price-row {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr 2fr;
      align-items: center;
      gap: 15px;
      padding: 13px 0;
      border-top: 2px solid #eee;
    }

    .price-label {
      font-size: clamp(23px, 4vw, 31px);
      font-weight: bold;
    }

    .price-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 64px;
      padding: 6px 12px;
      border: 2px solid #e0c572;
      border-radius: 11px;
      background: var(--gold-light);
    }

    .price {
      color: var(--gold-dark);
      font-size: clamp(28px, 6vw, 45px);
      font-weight: bold;
      line-height: 1.15;
      text-align: right;
      white-space: nowrap;
    }

    .direction {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 45px;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      font-size: 27px;
      font-weight: bold;
      line-height: 1;
    }

    .up {
      border: 2px solid var(--green);
      background: var(--green-bg);
      color: var(--green);
    }

    .down {
      border: 2px solid var(--red);
      background: var(--red-bg);
      color: var(--red);
    }

    .same {
      border: 2px solid var(--gray);
      background: var(--gray-bg);
      color: var(--gray);
    }

    .information {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .info-box {
      padding: 9px 12px;
      border: 1px solid #ddd;
      border-radius: 9px;
      background: #fafafa;
    }

    .info-label {
      display: block;
      color: var(--muted);
      font-size: 15px;
    }

    .info-value {
      display: block;
      color: var(--gold-dark);
      font-size: clamp(16px, 2.8vw, 21px);
      font-weight: bold;
    }

    .info-value.val-up {
      color: var(--green);
    }

    .info-value.val-down {
      color: var(--red);
    }

    .info-value.val-same {
      color: var(--gray);
    }

    #status {
      min-height: 27px;
      margin: 12px 0 4px;
      color: var(--green);
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }

    .error {
      color: var(--red) !important;
    }

    #refreshButton {
      width: 100%;
      min-height: 57px;
      margin-top: 10px;
      padding: 9px 16px;
      border: 2px solid #8d650e;
      border-radius: 11px;
      background: var(--gold);
      color: white;
      cursor: pointer;
      font-family: inherit;
      font-size: clamp(22px, 4vw, 28px);
      font-weight: bold;
    }

    #refreshButton:hover,
    #refreshButton:focus {
      background: #946b0d;
      outline: 3px solid rgba(184, 135, 22, .25);
      outline-offset: 2px;
    }

    #refreshButton:disabled {
      border-color: #999;
      background: #999;
      color: #eee;
      cursor: not-allowed;
      pointer-events: none;
      opacity: 1;
    }

    @media (max-width: 600px) {
      .page {
        padding: 9px 10px 14px;
      }

      header {
        margin-bottom: 10px;
        padding: 10px 12px;
      }

      .logo {
        flex-basis: 46px;
        width: 46px;
        height: 46px;
        font-size: 26px;
      }

      .price-card {
        padding: 15px;
      }

      .price-row {
        grid-template-columns: 1fr;
        gap: 7px;
        padding: 11px 0;
      }

      .price-box {
        min-height: 60px;
      }

      .information {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="top-line"></div>

    <header>
      <div class="logo">฿</div>
      <div>
        <h1>ราคาทองคำไทย</h1>
        <p class="subtitle">ราคาทองคำแท่ง 96.5%</p>
      </div>
    </header>

    <main>
      <section class="price-card">
        <h2 class="card-title">ทองคำแท่ง 96.5%</h2>
        <p class="card-subtitle">หน่วย: บาทต่อทองคำ 1 บาท</p>

        <div class="price-row">
          <div class="price-label">รับซื้อ</div>
          <div class="price-box">
            <span
              id="barBuyArrow"
              class="direction same"
              aria-label="ราคาไม่เปลี่ยน"
            >—</span>
            <span id="barBuy" class="price">-</span>
          </div>
        </div>

        <div class="price-row">
          <div class="price-label">ขายออก</div>
          <div class="price-box">
            <span
              id="barSellArrow"
              class="direction same"
              aria-label="ราคาไม่เปลี่ยน"
            >—</span>
            <span id="barSell" class="price">-</span>
          </div>
        </div>

        <div class="information">
          <div class="info-box">
            <span class="info-label">วันที่ประกาศ</span>
            <span id="updateDate" class="info-value">-</span>
          </div>

          <div class="info-box">
            <span class="info-label">เวลาปรับราคา</span>
            <span id="updateTime" class="info-value">-</span>
          </div>

          <div class="info-box">
            <span class="info-label">เทียบกับเมื่อวาน</span>
            <span id="diffYesterday" class="info-value val-same">-</span>
          </div>
        </div>
      </section>
    </main>

    <p id="status" aria-live="polite">กำลังโหลดข้อมูล...</p>

    <button id="refreshButton" type="button">
      ↻ อัปเดตราคา
    </button>
  </div>

  <script>
    const API_URL = "https://api.chnwt.dev/thai-gold-api/latest";
    const STORAGE_KEY = "goldPriceLatestData";
    const AUTO_REFRESH_TIME = 40000;
    const BUTTON_LOCK_TIME = 1500;

    const refreshButton = document.getElementById("refreshButton");

    let isLoading = false;

    function toNumber(value) {
      if (value === null || value === undefined || value === "") {
        return null;
      }

      const number = Number(
        String(value)
          .replace(/,/g, "")
          .replace(/[^\d.-]/g, "")
      );

      return Number.isFinite(number) ? number : null;
    }

    function formatBaht(value) {
      const number = toNumber(value);

      if (number === null) {
        return "-";
      }

      return new Intl.NumberFormat("th-TH", {
        style: "currency",
        currency: "THB",
        minimumFractionDigits: 2
      }).format(number);
    }

    function formatDifference(value) {
      const number = toNumber(value);

      if (number === null) {
        return "-";
      }

      const formatted = number.toLocaleString("th-TH", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });

      return number > 0 ? `+${formatted} บาท` : `${formatted} บาท`;
    }

    function getArrowState(changeValue) {
      const change = toNumber(changeValue);

      if (change === null || change === 0) {
        return {
          className: "same",
          symbol: "—",
          label: "ราคาไม่เปลี่ยน"
        };
      }

      if (change > 0) {
        return {
          className: "up",
          symbol: "▲",
          label: "ราคาขึ้น"
        };
      }

      return {
        className: "down",
        symbol: "▼",
        label: "ราคาลง"
      };
    }

    function setArrow(arrowId, changeValue) {
      const arrow = document.getElementById(arrowId);
      const state = getArrowState(changeValue);

      arrow.className = `direction ${state.className}`;
      arrow.textContent = state.symbol;
      arrow.setAttribute("aria-label", state.label);
    }

    function getStoredData() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);

        if (!stored) {
          return null;
        }

        const data = JSON.parse(stored);

        if (!data || typeof data !== "object") {
          return null;
        }

        return data;
      } catch (error) {
        console.error("ไม่สามารถอ่านข้อมูลจาก localStorage ได้", error);
        return null;
      }
    }

    function saveStoredData(data) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (error) {
        console.error("ไม่สามารถบันทึกข้อมูลลง localStorage ได้", error);
      }
    }

    function getReliableChange(
      price,
      result,
      currentBarSell,
      previousData
    ) {
      const apiChangeCandidates = [
        price?.change,
        price?.gold_bar?.change,
        price?.gold_bar?.change_value,
        result?.change
      ];

      for (const candidate of apiChangeCandidates) {
        const change = toNumber(candidate);

        if (change !== null) {
          return change;
        }
      }

      const previousSell = toNumber(previousData?.barSell);

      if (
        currentBarSell !== null &&
        previousSell !== null &&
        currentBarSell !== previousSell
      ) {
        return currentBarSell - previousSell;
      }

      return null;
    }

    function calculateYesterdayDifference(
      currentSell,
      currentDate,
      apiChange,
      previousData
    ) {
      const diffElement = document.getElementById("diffYesterday");

      if (currentSell === null) {
        diffElement.textContent = "-";
        diffElement.className = "info-value val-same";
        return null;
      }

      let difference = toNumber(apiChange);

      if (
        difference === null &&
        previousData &&
        previousData.date &&
        currentDate &&
        previousData.date !== currentDate
      ) {
        const previousSell = toNumber(previousData.barSell);

        if (previousSell !== null) {
          difference = currentSell - previousSell;
        }
      }

      if (difference === null) {
        diffElement.textContent = "-";
        diffElement.className = "info-value val-same";
        return null;
      }

      diffElement.textContent = formatDifference(difference);

      if (difference > 0) {
        diffElement.className = "info-value val-up";
      } else if (difference < 0) {
        diffElement.className = "info-value val-down";
      } else {
        diffElement.className = "info-value val-same";
      }

      return difference;
    }

    function renderData(data) {
      if (!data) {
        return;
      }

      const barBuy = toNumber(data.barBuy);
      const barSell = toNumber(data.barSell);

      document.getElementById("barBuy").textContent = formatBaht(barBuy);
      document.getElementById("barSell").textContent = formatBaht(barSell);

      document.getElementById("updateDate").textContent =
        data.date || "-";

      document.getElementById("updateTime").textContent =
        data.time || "-";

      setArrow("barBuyArrow", data.change);
      setArrow("barSellArrow", data.change);

      const diffElement = document.getElementById("diffYesterday");
      const difference = toNumber(data.difference);

      if (difference === null) {
        diffElement.textContent = "-";
        diffElement.className = "info-value val-same";
      } else {
        diffElement.textContent = formatDifference(difference);

        if (difference > 0) {
          diffElement.className = "info-value val-up";
        } else if (difference < 0) {
          diffElement.className = "info-value val-down";
        } else {
          diffElement.className = "info-value val-same";
        }
      }
    }

    function lockButton() {
      refreshButton.disabled = true;
      refreshButton.textContent = "กำลังอัปเดต...";

      setTimeout(() => {
        refreshButton.disabled = false;
        refreshButton.textContent = "↻ อัปเดตราคา";
      }, BUTTON_LOCK_TIME);
    }

    async function loadGoldPrice() {
      if (isLoading) {
        return;
      }

      isLoading = true;
      lockButton();

      const status = document.getElementById("status");
      const previousData = getStoredData();

      status.className = "";
      status.textContent = "กำลังอัปเดตราคาล่าสุด...";

      try {
        const response = await fetch(API_URL, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        if (!data || !data.response || !data.response.price) {
          throw new Error("รูปแบบข้อมูลไม่ถูกต้อง");
        }

        const result = data.response;
        const price = result.price;

        const currentBarBuy = toNumber(price.gold_bar?.buy);
        const currentBarSell = toNumber(price.gold_bar?.sell);

        if (currentBarBuy === null && currentBarSell === null) {
          throw new Error("ไม่พบราคาทองคำแท่ง");
        }

        const reliableChange = getReliableChange(
          price,
          result,
          currentBarSell,
          previousData
        );

        const difference = calculateYesterdayDifference(
          currentBarSell,
          result.update_date,
          reliableChange,
          previousData
        );

        const latestData = {
          barBuy: currentBarBuy,
          barSell: currentBarSell,
          date: result.update_date || "",
          time: result.update_time || "",
          change: reliableChange,
          difference: difference,
          savedAt: Date.now()
        };

        renderData(latestData);
        saveStoredData(latestData);

        status.textContent = "อัปเดตข้อมูลสำเร็จ";
      } catch (error) {
        console.error(error);

        if (previousData) {
          renderData(previousData);
          status.className = "error";
          status.textContent =
            "เชื่อมต่อข้อมูลล่าสุดไม่ได้ กำลังแสดงข้อมูลที่บันทึกไว้";
        } else {
          renderData({
            barBuy: null,
            barSell: null,
            date: "",
            time: "",
            change: null,
            difference: null
          });

          status.className = "error";
          status.textContent =
            "ไม่สามารถโหลดข้อมูลได้ กรุณาลองใหม่อีกครั้ง";
        }
      } finally {
        isLoading = false;
      }
    }

    refreshButton.addEventListener("click", loadGoldPrice);

    const cachedData = getStoredData();

    if (cachedData) {
      renderData(cachedData);
      document.getElementById("status").textContent =
        "กำลังตรวจสอบราคาล่าสุด...";
    }

    loadGoldPrice();

    setInterval(loadGoldPrice, AUTO_REFRESH_TIME);
  </script>
</body>
</html>
